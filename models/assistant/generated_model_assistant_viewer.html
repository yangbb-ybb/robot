<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 智能助手模型预览</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #eef3f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrap { width: 100%; height: 100%; display: flex; flex-direction: column; }
    header { padding: 18px 22px; color: #17343a; background: #ffffff; border-bottom: 1px solid #d9e3e6; }
    h1 { margin: 0 0 5px; font-size: 18px; font-weight: 600; }
    p { margin: 0; font-size: 13px; color: #5c7076; }
    model-viewer { flex: 1; width: 100%; min-height: 0; --poster-color: #eef3f5; }
    .hint { padding: 10px 18px; text-align: center; background: #ffffff; color: #5c7076; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>3D 智能助手模型</h1>
      <p>可拖动旋转、滚轮缩放，用于后续接入文字、语音和点击交互。</p>
    </header>
    <model-viewer src="assistant.glb" alt="3D 智能助手模型" camera-controls auto-rotate shadow-intensity="0.35" exposure="1.05" interaction-prompt="auto"></model-viewer>
    <div class="hint">拖动模型旋转 · 滚轮缩放 · 后续可加入待机、说话和点击反馈动作</div>
  </div>
</body>
</html>
