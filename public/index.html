<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>3D 智能聊天助手</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: transparent; color: #e8f3f3; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; min-height: 100vh; overflow: hidden; background: #0c171b; }
    .app { height: 100vh; min-height: 0; display: grid; grid-template-columns: minmax(280px, 1fr) minmax(340px, 440px); overflow: hidden; background: #0c171b; }
    body.compact, body.compact .app { background: transparent; }
    body.compact { background: transparent; overflow: hidden; }
    body.compact .app { height: 100vh; display: block; background: transparent; overflow: hidden; }
    body.compact .stage { height: 100vh; min-height: 0; background: transparent; }
    body.compact .brand, body.compact .stage-tip, body.compact .chat { display: none; }
    body.compact .app, body.compact .stage { background: transparent; }
    body.compact model-viewer { pointer-events: auto; }
    body.compact model-viewer { display: block; width: 100%; height: 100%; min-height: 0; background: transparent !important; background-color: transparent !important; --poster-color: rgba(0, 0, 0, 0); }
    body.compact model-viewer::part(default-progress-bar) { display: none; }
    body.compact model-viewer canvas { background: transparent !important; }
    .stage { min-height: 0; position: relative; display: flex; flex-direction: column; background: #102126; }
    .brand { padding: 22px 28px; font-size: 14px; letter-spacing: .08em; color: #8edbd0; }
    model-viewer { flex: 1; width: 100%; min-height: 0; --poster-color: #102126; }
    .stage-tip { padding: 16px 28px 24px; color: #8aa4a7; font-size: 13px; }
    .chat { min-height: 0; display: flex; flex-direction: column; border-left: 1px solid #294247; background: #101c20; }
    .chat-head { flex: 0 0 auto; padding: 25px 24px 18px; border-bottom: 1px solid #294247; }
    .chat-head h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
    .chat-head p { margin: 0; color: #8aa4a7; font-size: 13px; }
    .messages { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 22px 20px; }
    .message { max-width: 92%; white-space: pre-wrap; line-height: 1.6; padding: 12px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 14px; }
    .assistant { background: #1c3338; color: #d7eeee; }
    .user { margin-left: auto; background: #17675f; color: #effffc; }
    .composer { flex: 0 0 auto; padding: 16px; border-top: 1px solid #294247; }
    textarea { width: 100%; min-height: 76px; resize: vertical; border: 1px solid #35565b; border-radius: 10px; background: #0c171b; color: #e8f3f3; padding: 12px; font: inherit; outline: none; }
    textarea:focus { border-color: #51c9bc; }
    .actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
    button { border: 1px solid #3d666b; border-radius: 8px; background: #183238; color: #dff8f5; padding: 9px 13px; cursor: pointer; font: inherit; }
    button:hover { background: #22474d; }
    button.primary { background: #188276; border-color: #38b9aa; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { color: #8aa4a7; font-size: 12px; }
    @media (max-width: 760px) { body { overflow: auto; } .app { height: auto; min-height: 100vh; display: flex; flex-direction: column; overflow: visible; } .stage { min-height: 48vh; } model-viewer { min-height: 300px; } .chat { min-height: 52vh; height: 52vh; border-left: 0; border-top: 1px solid #294247; } }
  </style>
</head>
<body>
  <main class="app">
    <section class="stage">
      <div class="brand">INTERACTIVE ASSISTANT / 3D CORE</div>
      <model-viewer id="assistant" src="/assets/assistant.glb" alt="3D 智能助手" camera-controls auto-rotate shadow-intensity="0.35" style="background: transparent; --poster-color: rgba(0, 0, 0, 0);"></model-viewer>
      <div class="stage-tip">点击或拖动助手进行观察。语音入口已预留，后续接入语音识别服务。</div>
    </section>
    <section class="chat">
      <header class="chat-head"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;"><div><h1>智能聊天助手</h1><p>把想法告诉我，我会先记录并准备拆解。</p></div><span style="display:flex;gap:8px;"><button id="mode" type="button" title="切换到右下角机器人模式">悬浮机器人</button><button id="pin" type="button" title="切换窗口置顶">置顶：关</button></span></div></header>
      <div id="messages" class="messages"><div class="message assistant">你好，我是你的 3D 智能助手。你可以输入一个想法，我会先接收并记录。</div></div>
      <form id="composer" class="composer">
        <textarea id="input" placeholder="例如：帮我设计一个个人主页"></textarea>
        <div class="actions"><span id="status" class="status">后端已连接 · 语音功能待接入</span><span><button id="voice" type="button" title="语音功能预留">语音（预留）</button> <button class="primary" type="submit">发送</button></span></div>
      </form>
    </section>
  </main>
  <script>
    const messages = document.querySelector('#messages');
    const input = document.querySelector('#input');
    const status = document.querySelector('#status');
    const assistant = document.querySelector('#assistant');
    const pin = document.querySelector('#pin');
    const mode = document.querySelector('#mode');
    const updatePinLabel = (value) => { pin.textContent = value ? '置顶：开' : '置顶：关'; };
    const updateModeLabel = (value) => { mode.textContent = value ? '恢复聊天窗口' : '悬浮机器人'; };
    const applyMode = (modeName) => { const compact = modeName === 'compact'; document.body.classList.toggle('compact', compact); assistant.setAttribute('shadow-intensity', compact ? '0' : '0.35'); assistant.style.background = 'transparent'; assistant.style.setProperty('--poster-color', 'rgba(0, 0, 0, 0)'); updateModeLabel(compact); };
    if (window.desktop) {
      window.desktop.getAlwaysOnTop().then(updatePinLabel);
      window.desktop.getMode().then((mode) => applyMode(mode ? 'compact' : 'normal'));
      pin.addEventListener('click', async () => updatePinLabel(await window.desktop.setAlwaysOnTop(!(pin.textContent === '置顶：开'))));
      mode.addEventListener('click', async () => applyMode((await window.desktop.setMode(!document.body.classList.contains('compact'))) ? 'compact' : 'normal'));
      window.desktop.onModeChanged(applyMode);
    }
    const add = (text, who) => { const el = document.createElement('div'); el.className = `message ${who}`; el.textContent = text; messages.appendChild(el); messages.scrollTop = messages.scrollHeight; };
    assistant.addEventListener('click', () => { add('你点击了我。后续这里可以绑定角色动作、状态切换或任务快捷入口。', 'assistant'); fetch('/api/events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event: 'assistant_click' }) }); });
    document.querySelector('#voice').addEventListener('click', () => { status.textContent = '语音转文字接口已预留，后续接入'; add('语音输入功能已预留，当前还不会调用识别服务。', 'assistant'); });
    document.querySelector('#composer').addEventListener('submit', async (event) => { event.preventDefault(); const text = input.value.trim(); if (!text) return; add(text, 'user'); input.value = ''; status.textContent = '正在请求后端…'; try { const response = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, source: 'text' }) }); const data = await response.json(); if (!response.ok) throw new Error(data.error || '请求失败'); add(data.reply, 'assistant'); status.textContent = '后端已连接 · 数据已记录'; } catch (error) { add(`暂时无法连接后端：${error.message}`, 'assistant'); status.textContent = '后端连接失败'; } });
  </script>
</body>
</html>
