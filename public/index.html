<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>3D 智能聊天助手</title>
  <script type="importmap">
    { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    } }
  </script>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: transparent; color: #eef1f5; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; min-height: 100vh; overflow: hidden; background: #11151a; }
    .app { height: 100vh; min-height: 0; display: grid; grid-template-rows: 36px minmax(0, 1fr); grid-template-columns: minmax(280px, 1fr) minmax(340px, 440px); overflow: hidden; background: #11151a; border-radius: 14px; }
    .window-bar { grid-column: 1 / -1; display: flex; align-items: center; padding: 0 14px 0 76px; color: #8f99a8; background: #171b21; border-bottom: 1px solid #363c46; -webkit-app-region: drag; user-select: none; font-size: 12px; letter-spacing: .04em; min-height: 36px; }
    .window-title { opacity: .9; }

    .stage { min-height: 0; position: relative; display: flex; flex-direction: column; background: #171b21; overflow: hidden; }
    .brand { padding: 20px 28px 0; font-size: 13px; letter-spacing: .08em; color: #b8c0cc; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .brand .mood-pill { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0; color: #9aa3af; }
    .mood-pill .bar { width: 74px; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, .14); overflow: hidden; }
    .mood-pill .bar b { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #7f8ea3, #c8b0a4); transition: width .5s ease; }

    .stage-body { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    #viewport { flex: 1 1 auto; min-height: 0; position: relative; cursor: grab; }
    #viewport:active { cursor: grabbing; }
    #viewport canvas { display: block; width: 100%; height: 100%; }
    .load-tip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8f99a8; font-size: 13px; letter-spacing: .08em; pointer-events: none; }

    .mood-ring { position: absolute; left: 50%; top: 50%; width: min(280px, 62%); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(150, 170, 205, .18), rgba(150, 170, 205, 0) 68%); transition: opacity .6s ease, background .6s ease; opacity: .8; }
    .mood-ring[data-mood="happy"] { background: radial-gradient(circle, rgba(232, 176, 158, .26), rgba(232, 176, 158, 0) 68%); }
    .mood-ring[data-mood="thinking"] { background: radial-gradient(circle, rgba(168, 156, 214, .26), rgba(168, 156, 214, 0) 68%); }
    .mood-ring[data-mood="sleepy"] { background: radial-gradient(circle, rgba(120, 130, 145, .12), rgba(120, 130, 145, 0) 68%); opacity: .45; }

    .bubble { position: absolute; left: 50%; top: 12px; max-width: 76%; transform: translate(-50%, -6px) scale(.96); padding: 8px 14px; border-radius: 14px; background: rgba(30, 35, 43, .92); border: 1px solid rgba(255, 255, 255, .16); color: #eef1f5; font-size: 13px; line-height: 1.5; text-align: center; opacity: 0; pointer-events: none; transition: opacity .22s ease, transform .22s ease; z-index: 5; backdrop-filter: blur(6px); }
    .bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

    .hit-hint { position: absolute; transform: translate(-50%, -140%); padding: 4px 9px; border-radius: 8px; background: rgba(24, 28, 34, .92); border: 1px solid rgba(255, 255, 255, .18); color: #e9edf3; font-size: 11px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .18s ease; z-index: 6; }
    .hit-hint.show { opacity: 1; }
    .ripple { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 2px solid rgba(240, 214, 200, .95); pointer-events: none; z-index: 7; animation: ripple .7s ease-out forwards; }
    @keyframes ripple { from { transform: scale(.4); opacity: .95; } to { transform: scale(5.2); opacity: 0; } }

    .stage-tip { padding: 4px 24px 18px; color: #9aa3af; font-size: 12px; display: flex; flex-direction: column; gap: 10px; }
    .quick { display: flex; gap: 8px; flex-wrap: wrap; }
    .quick button { padding: 7px 12px; font-size: 12px; border-radius: 999px; }

    .chat { min-height: 0; display: flex; flex-direction: column; border-left: 1px solid #363c46; background: #15191f; }
    .chat-head { flex: 0 0 auto; padding: 25px 24px 18px; border-bottom: 1px solid #363c46; }
    .chat-head h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
    .chat-head p { margin: 0; color: #9aa3af; font-size: 13px; }
    .messages { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 22px 20px; }
    .message { max-width: 92%; white-space: pre-wrap; line-height: 1.6; padding: 12px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 14px; }
    .assistant { background: #252b34; color: #e5e9ef; }
    .user { margin-left: auto; background: #3a4655; color: #f4f6f8; }
    .pending { color: #9aa3af; font-style: italic; }
    .composer { flex: 0 0 auto; padding: 16px; border-top: 1px solid #363c46; }
    textarea { width: 100%; min-height: 76px; resize: vertical; border: 1px solid #4a5563; border-radius: 10px; background: #101419; color: #eef1f5; padding: 12px; font: inherit; outline: none; }
    textarea:focus { border-color: #aab4c2; }
    .actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
    button { border: 1px solid #566272; border-radius: 8px; background: #252c35; color: #e8ecf1; padding: 9px 13px; cursor: pointer; font: inherit; }
    button:hover { background: #313a46; }
    button.primary { background: #566476; border-color: #7d8a9b; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { color: #9aa3af; font-size: 12px; }

    /* 机器人悬浮模式：保持完全透明，只留下角色和顶部栏 */
    body.compact, body.compact .app { background: transparent; }
    body.compact { background: transparent; overflow: hidden; }
    body:not(.compact) { background: #11151a; }
    body.compact .app { height: 100vh; display: block; background: transparent; overflow: hidden; border-radius: 0; }
    body.compact .stage { height: 100vh; min-height: 0; padding-top: 36px; background: transparent; }
    body.compact .stage-body { flex: 1 1 auto; min-height: 0; }
    body.compact .brand, body.compact .stage-tip, body.compact .chat, body.compact .mood-ring { display: none; }
    body.compact .bubble { top: 8px; background: rgba(26, 30, 36, .85); }
    body.compact .window-bar { display: flex !important; position: fixed; inset: 0 0 auto; z-index: 99999; width: 100%; height: 36px; padding-left: 76px; background: transparent !important; border-bottom: 0; color: rgba(255, 255, 255, .92); text-shadow: 0 1px 3px rgba(0, 0, 0, .85); }

    @media (max-width: 760px) { body { overflow: auto; } .app { height: auto; min-height: 100vh; display: flex; flex-direction: column; overflow: visible; } .stage { min-height: 48vh; } #viewport { min-height: 300px; } .chat { min-height: 52vh; height: 52vh; border-left: 0; border-top: 1px solid #363c46; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="window-bar"><span class="window-title">3D 智能聊天助手</span></div>
    <section class="stage" id="stage">
      <div class="brand">
        <span>INTERACTIVE ASSISTANT / 3D CORE</span>
        <span class="mood-pill"><span id="moodText">心情：待机</span><i class="bar"><b id="bondBar"></b></i><span id="bondText">亲和度 0</span></span>
      </div>
      <div class="stage-body">
        <div class="mood-ring" id="ring" data-mood="idle"></div>
        <div id="viewport"><div class="load-tip" id="loadTip">正在加载 3D 模型…</div></div>
        <div class="bubble" id="bubble"></div>
        <div class="hit-hint" id="hitHint"></div>
      </div>
      <div class="stage-tip">
        <div class="quick">
          <button id="act-hello" type="button">打个招呼</button>
          <button id="act-pat" type="button">摸摸头</button>
          <button id="act-rest" type="button">去休息</button>
        </div>
        <span>她的头会跟着你的鼠标转，点她的手她会挥手，拖动可以环视。</span>
      </div>
    </section>
    <section class="chat">
      <header class="chat-head"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;"><div><h1>智能聊天助手</h1><p>把想法告诉我，我会先记录并准备拆解。</p></div><span style="display:flex;gap:8px;"><button id="mode" type="button" title="切换到右下角机器人模式">悬浮机器人</button><button id="pin" type="button" title="切换窗口置顶">置顶：关</button></span></div></header>
      <div id="messages" class="messages"><div class="message assistant">你好，我是你的 3D 智能助手。你可以输入一个想法，我会先接收并记录。</div></div>
      <form id="composer" class="composer">
        <textarea id="input" placeholder="例如：帮我设计一个个人主页"></textarea>
        <div class="actions"><span id="status" class="status">后端已连接 · 语音功能待接入</span><span><button id="voice" type="button" title="语音功能预留">语音（预留）</button> <button class="primary" type="submit">发送</button></span></div>
      </form>
    </section>
  </main>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const messages = document.querySelector('#messages');
    const input = document.querySelector('#input');
    const statusEl = document.querySelector('#status');
    const stage = document.querySelector('#stage');
    const viewport = document.querySelector('#viewport');
    const loadTip = document.querySelector('#loadTip');
    const ring = document.querySelector('#ring');
    const bubble = document.querySelector('#bubble');
    const hitHint = document.querySelector('#hitHint');
    const moodText = document.querySelector('#moodText');
    const bondBar = document.querySelector('#bondBar');
    const bondText = document.querySelector('#bondText');
    const pin = document.querySelector('#pin');
    const mode = document.querySelector('#mode');

    const MOOD_LABEL = { idle: '待机', curious: '好奇', happy: '开心', shy: '害羞', thinking: '思考中', speaking: '说话中', sleepy: '犯困', annoyed: '有点晕' };
    const state = {
      mood: 'idle',
      bond: Number(localStorage.getItem('assistant-bond') || 0),
      lastActive: Date.now(),
      dragging: false,
      dragStartAzimuth: null,
      dragMoved: false,
      sleeping: false,
      busy: false,
      pointer: null,
      look: { x: 0, y: 0 },
      hintAt: 0,
      bubbleTimer: null,
      moodTimer: null
    };

    /* ---------- 基础状态与数值 ---------- */

    const saveBond = () => localStorage.setItem('assistant-bond', String(state.bond));

    const updateBond = (delta) => {
      state.bond = Math.max(0, Math.min(999, state.bond + delta));
      saveBond();
      const level = Math.floor(state.bond / 40) + 1;
      bondBar.style.width = `${(state.bond % 40) / 40 * 100}%`;
      bondText.textContent = `亲和度 Lv.${level}`;
    };

    const setMood = (next, holdMs) => {
      state.mood = next;
      ring.dataset.mood = next === 'curious' ? 'idle' : next;
      moodText.textContent = `心情：${MOOD_LABEL[next] || '待机'}`;
      renderer.toneMappingExposure = next === 'sleepy' ? 0.7 : 1.0;
      if (state.moodTimer) clearTimeout(state.moodTimer);
      if (holdMs) {
        state.moodTimer = setTimeout(() => {
          if (state.mood === next) setMood(state.sleeping ? 'sleepy' : 'idle');
        }, holdMs);
      }
    };

    const showBubble = (text, ms = 2600) => {
      bubble.textContent = text;
      bubble.classList.add('show');
      if (state.bubbleTimer) clearTimeout(state.bubbleTimer);
      state.bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
    };

    /* ---------- Three.js 场景 ---------- */

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
    let compactLayout = false;
    const applyCameraLayout = (compact) => {
      compactLayout = Boolean(compact);
      // 普通聊天窗口和 360x400 悬浮窗口不是同一取景比例。
      // 悬浮模式需要拉远相机，否则模型会比窗口/UI 更大并被裁切。
      camera.position.set(0, compactLayout ? 0.98 : 0.95, compactLayout ? 4.85 : 3.35);
      controls?.target?.set(0, compactLayout ? 0.86 : 0.82, 0);
      camera.updateProjectionMatrix();
    };
    camera.position.set(0, 0.95, 3.35);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    viewport.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xdfe8f2, 0x2a2f38, 1.15));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
    keyLight.position.set(1.6, 2.4, 2.2);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xaec3d8, 0.5);
    fillLight.position.set(-1.8, 1.2, 1.4);
    scene.add(fillLight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.82, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.minPolarAngle = 0.9;
    controls.maxPolarAngle = 1.85;
    controls.rotateSpeed = 0.9;

    const root = new THREE.Group();
    scene.add(root);

    let model = null, mixer = null, headBone = null, clips = {}, skeletonMeshes = [];
    let leftHandBone = null, rightHandBone = null;
    let baseAction = null, currentAction = null;
    const LOOK_SIGN = { yaw: 1, pitch: 1 };
    let clock = new THREE.Clock();
    let spinSpeed = 0;

    const resize = () => {
      const w = viewport.clientWidth || 1, h = viewport.clientHeight || 1;
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    };
    new ResizeObserver(resize).observe(viewport);
    resize();

    new GLTFLoader().load('/assets/assistant.glb', (gltf) => {
      model = gltf.scene;
      root.add(model);
      // 注意：不要对 gltf.scene 做缩放归一化。SkinnedMesh 的 bindMatrix 在
      // 加载时已固定，且 Box3.setFromObject 对蒙皮网格拿到的是未蒙皮的
      // bind-pose 包围盒（本模型只有 0.0166 m），据此缩放会把模型放大几十倍
      // 并彻底破坏蒙皮。取景统一由相机参数处理。
      gltf.animations.forEach((clip) => { clips[clip.name] = clip; });
      mixer = new THREE.AnimationMixer(model);
      mixer.addEventListener('finished', () => backToIdle());
      model.traverse((o) => {
        if (o.isMesh || o.isSkinnedMesh) skeletonMeshes.push(o);
        if (o.isSkinnedMesh) o.frustumCulled = false;
        if (o.isBone) {
          const n = o.name.replace(/:/g, '');
          if (/^(mixamorig)?Head$/i.test(n) && !headBone) headBone = o;
          if (/^(mixamorig)?LeftHand$/i.test(n)) leftHandBone = o;
          if (/^(mixamorig)?RightHand$/i.test(n)) rightHandBone = o;
        }
      });
      if (!headBone) {
        model.traverse((o) => {
          if (o.isBone && /head/i.test(o.name) && !/top_end/i.test(o.name) && !headBone) headBone = o;
        });
      }
      const idle = clips.Idle || gltf.animations[0];
      if (idle) {
        baseAction = mixer.clipAction(idle);
        baseAction.setLoop(THREE.LoopRepeat).play();
        currentAction = baseAction;
      }
      loadTip.remove();
      onModelReady();
    }, undefined, () => {
      loadTip.textContent = '模型加载失败，检查资源文件';
      statusEl.textContent = '模型加载失败';
    });

    const onModelReady = () => {
      updateBond(0);
      setTimeout(() => { if (!state.sleeping) showBubble('我准备好了，随时可以开始。', 2600); }, 600);
    };

    /* ---------- 动作播放与混合 ---------- */

    const backToIdle = () => {
      if (!mixer) return;
      const idle = baseAction;
      if (currentAction && currentAction !== idle) {
        currentAction.fadeOut(0.18);
        idle.reset().fadeIn(0.18).play();
        currentAction = idle;
      }
    };

    const playAction = (name, { hold = 0 } = {}) => {
      if (!mixer || !clips[name]) return false;
      const next = mixer.clipAction(clips[name]);
      next.setLoop(THREE.LoopOnce);
      next.clampWhenFinished = false;
      if (currentAction && currentAction !== next) currentAction.fadeOut(0.15);
      next.reset().fadeIn(0.15).play();
      currentAction = next;
      return true;
    };

    const bounce = (strength = 1) => {
      const t0 = performance.now();
      const hop = (now) => {
        const t = (now - t0) / 420;
        if (t >= 1) { root.position.y = 0; return; }
        root.position.y = Math.sin(t * Math.PI) * 0.035 * strength;
        requestAnimationFrame(hop);
      };
      requestAnimationFrame(hop);
    };

    const nod = () => { if (!playAction('Nod')) bounce(0.8); };
    const shake = () => { if (!playAction('Shake')) bounce(0.5); };
    const wave = () => { if (!playAction('Wave')) bounce(1); };
    const waveLeft = () => { if (!playAction('WaveLeft')) bounce(0.8); };
    const thinkPose = () => { if (!playAction('Think')) setMood('thinking'); };
    const happyPose = () => { playAction('Happy'); };

    /* ---------- 头部看鼠标（带撤销，避免逐帧累积把头拧到背后） ---------- */

    const _parentQ = new THREE.Quaternion();
    const _yawQ = new THREE.Quaternion();
    const _pitchQ = new THREE.Quaternion();
    const _lookLp = new THREE.Quaternion();
    let _appliedLook = null;
    const Y_AXIS = new THREE.Vector3(0, 1, 0);
    const X_AXIS = new THREE.Vector3(1, 0, 0);
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    // 必须在 mixer.update() 之前调用。旧写法每帧把 headBone.quaternion 当作
    // rest 再叠加 look：当某个 clip 没有 Head 通道时 mixer 不会覆盖该值，
    // 头就会逐帧越转越歪，最终拧到背后（截图里那个怪头的主因）。
    const undoLook = () => {
      if (_appliedLook && headBone) {
        headBone.quaternion.premultiply(_appliedLook.clone().invert());
        _appliedLook = null;
      }
    };

    const applyLook = () => {
      if (!headBone || !model || state.dragging) return;
      // 动作播放期间降低跟随强度，避免和动作自身的头部旋转叠加
      const busy = currentAction && currentAction !== baseAction ? 0.45 : 1;
      const influence = (state.sleeping ? 0.2 : 1) * busy;
      const yaw = clamp(state.look.x * 0.45 * LOOK_SIGN.yaw * influence, -0.26, 0.26);
      const pitch = clamp(state.look.y * 0.3 * LOOK_SIGN.pitch * influence, -0.16, 0.16);
      if (Math.abs(yaw) + Math.abs(pitch) < 0.001) return;
      headBone.parent.getWorldQuaternion(_parentQ);
      _yawQ.setFromAxisAngle(Y_AXIS, yaw);
      _pitchQ.setFromAxisAngle(X_AXIS, pitch);
      const worldRot = _yawQ.clone().multiply(_pitchQ);
      // 世界空间旋转 -> 父骨骼局部空间：parentQ^-1 * R * parentQ
      _lookLp.copy(_parentQ).invert().multiply(worldRot).multiply(_parentQ);
      headBone.quaternion.premultiply(_lookLp);
      _appliedLook = _lookLp.clone();
    };

    /* ---------- 渲染循环 ---------- */

    const render = () => {
      requestAnimationFrame(render);
      const dt = clock.getDelta();
      undoLook();
      if (mixer) {
        mixer.timeScale = state.sleeping ? 0.55 : 1;
        mixer.update(dt);
      }
      if (spinSpeed && !state.dragging) {
        root.rotation.y += spinSpeed * dt;
      } else {
        root.rotation.y *= 0.94;
      }
      applyLook();
      controls.update();
      renderer.render(scene, camera);
    };
    render();

    /* ---------- 互动反馈 ---------- */

    const HELLO_LINES = ['我在。今天想先做哪一件事？', '嗨，我一直在这。', '你来了，我等你好久了。'];
    const PAT_LINES = ['唔……被摸头了。', '再摸一下，就一下。', '谢谢你，今天也辛苦了。'];
    const POKE_LINES = ['诶？你戳我。', '我在呢，随时可以开始。', '轻一点，会痒的。', '这样戳我，是想聊天吗？'];
    const SHY_LINES = ['别一直看着我啦……', '是不是有点太近了？', '我、我有点不好意思。'];
    const DIZZY_LINES = ['晕啦，别转这么快。', '慢一点，我跟不上你了。'];
    const AMBIENT_LINES = ['要不要把那个想法写下来？', '我在这里，随时可以开始。', '安静一会儿也挺好的。'];
    const WAKE_LINES = ['我没睡，只是在想事情。', '嗯？你回来了。'];

    const pick = (list) => list[Math.floor(Math.random() * list.length)];

    const logEvent = (name, extra = {}) => {
      fetch('/api/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ event: name, mood: state.mood, bond: state.bond, ...extra })
      }).catch(() => {});
    };

    const greet = () => {
      if (state.busy) return;
      state.lastActive = Date.now();
      wakeUp();
      setMood('happy', 2400);
      wave();
      showBubble(state.bond >= 80 ? '你好啊，今天也一起加油吧。' : '你好啊！我在这里。');
      updateBond(2);
      add('她抬起手朝你挥了挥：「你好啊。」', 'assistant');
      logEvent('assistant_greet');
    };

    const handTouch = (side) => {
      if (state.busy) return;
      state.lastActive = Date.now();
      wakeUp();
      setMood('happy', 2400);
      (side === 'left' ? waveLeft() : wave());
      const lines = side === 'left'
        ? ['这只手也要打招呼吗？', '左手也举起来了。']
        : ['你好啊！是要握手吗？', '嗨，我在这里。', '你好啊，很高兴见到你。'];
      showBubble(pick(lines));
      updateBond(3);
      add(`你碰到了她的${side === 'left' ? '左' : '右'}手，她抬起手回应了你。`, 'assistant');
      logEvent('assistant_hand_touch', { side });
    };

    const pat = () => {
      if (state.busy) return;
      state.lastActive = Date.now();
      wakeUp();
      setMood('shy', 2600);
      playAction('Pat') || nod();
      showBubble(pick(PAT_LINES));
      updateBond(4);
      add('她被摸头了，看起来有点高兴。', 'assistant');
      logEvent('assistant_pat');
    };

    const poke = () => {
      if (state.busy) return;
      state.lastActive = Date.now();
      wakeUp();
      const familiar = state.bond >= 120;
      setMood(familiar ? 'shy' : 'happy', 2200);
      bounce(0.8);
      showBubble(familiar ? pick(SHY_LINES) : pick(POKE_LINES));
      updateBond(2);
      logEvent('assistant_click');
    };

    const rest = () => {
      state.sleeping = true;
      setMood('sleepy');
      showBubble('那我先安静一会儿，你叫我一声就好。', 3200);
      add('她闭上眼睛，进入了待机状态。', 'assistant');
      logEvent('assistant_rest');
    };

    const wakeUp = () => {
      if (!state.sleeping) return;
      state.sleeping = false;
      setMood('curious', 1600);
      showBubble(pick(WAKE_LINES));
    };

    /* ---------- 命中检测: 点击手 vs 点击身体 ---------- */

    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();

    const pickModel = (clientX, clientY) => {
      if (!model || !skeletonMeshes.length) return null;
      const rect = viewport.getBoundingClientRect();
      ndc.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObjects(skeletonMeshes, false);
      if (!hits.length) return null;
      return model.worldToLocal(hits[0].point.clone());
    };

    const _handProj = new THREE.Vector3();
    const handScreen = () => {
      const rect = viewport.getBoundingClientRect();
      const out = [];
      for (const [side, bone] of [['left', leftHandBone], ['right', rightHandBone]]) {
        if (!bone) continue;
        bone.getWorldPosition(_handProj);
        _handProj.project(camera);
        out.push({ side,
          x: rect.left + (_handProj.x + 1) * 0.5 * rect.width,
          y: rect.top + (1 - _handProj.y) * 0.5 * rect.height });
      }
      return out;
    };
    const handAt = (clientX, clientY) => {
      // 只看手骨骼的屏幕投影距离：不用射线命中做前置判断，
      // 否则待机手臂微摆会让"点手"时灵时不灵。完全不依赖 3D 单位。
      const rect = viewport.getBoundingClientRect();
      let best = null, bestD = rect.height * 0.07;
      for (const h of handScreen()) {
        const d = Math.hypot(clientX - h.x, clientY - h.y);
        if (d < bestD) { bestD = d; best = h.side; }
      }
      return best;
    };

    const hintAt = (clientX, clientY) => {
      const now = performance.now();
      if (now - state.hintAt < 90) return;
      state.hintAt = now;
      const side = handAt(clientX, clientY);
      if (!side) { hitHint.classList.remove('show'); return; }
      hitHint.textContent = '点一下手 → 打招呼';
      const rect = viewport.getBoundingClientRect();
      hitHint.style.left = `${clientX - rect.left}px`;
      hitHint.style.top = `${clientY - rect.top}px`;
      hitHint.classList.add('show');
    };

    /* ---------- 鼠标与拖拽 ---------- */

    stage.addEventListener('pointermove', (event) => {
      state.lastActive = Math.max(state.lastActive, 0);
      if (state.mood === 'idle' && Math.random() < 0.01) setMood('curious', 1200);
      const rect = viewport.getBoundingClientRect();
      state.pointer = { x: event.clientX, y: event.clientY };
      state.look.x = Math.max(-.5, Math.min(.5, (event.clientX - rect.left) / rect.width - .5));
      state.look.y = Math.max(-.5, Math.min(.5, (event.clientY - rect.top) / rect.height - .5));
      hintAt(event.clientX, event.clientY);
    });

    stage.addEventListener('pointerleave', () => {
      hitHint.classList.remove('show');
      state.look.x *= 0.5; state.look.y *= 0.5;
    });

    renderer.domElement.addEventListener('pointerdown', (event) => {
      state.dragging = true;
      state.dragMoved = false;
      state.lastActive = Date.now();
      state.dragStartAzimuth = controls.getAzimuthalAngle();
    });

    const endDrag = () => {
      if (!state.dragging) return;
      state.dragging = false;
      if (state.dragStartAzimuth !== null) {
        let delta = Math.abs(controls.getAzimuthalAngle() - state.dragStartAzimuth);
        if (delta > Math.PI) delta = Math.PI * 2 - delta;
        if (delta > 1.6) {
          setMood('annoyed', 1800);
          shake();
          showBubble(pick(DIZZY_LINES));
          state.dragMoved = true;
        } else if (delta > 0.07) {
          state.dragMoved = true;
        }
      }
      state.dragStartAzimuth = null;
    };

    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);

    renderer.domElement.addEventListener('click', (event) => {
      if (state.dragMoved) { state.dragMoved = false; return; }
      const side = handAt(event.clientX, event.clientY);
      if (side) handTouch(side);
      else poke();
    });

    renderer.domElement.addEventListener('dblclick', () => { if (!state.busy) greet(); });

    /* ---------- 空闲与自主动作 ---------- */

    setInterval(() => {
      const idleFor = Date.now() - state.lastActive;
      if (state.busy) return;
      if (idleFor > 120000 && !state.sleeping) {
        state.sleeping = true;
        setMood('sleepy');
        showBubble('等太久了，我先眯一会儿。', 3000);
      }
    }, 5000);

    setInterval(() => {
      if (state.busy || state.sleeping || state.dragging) return;
      if (Date.now() - state.lastActive < 15000) return;
      setMood('curious', 1800);
      showBubble(pick(AMBIENT_LINES), 3000);
      happyPose();
    }, 32000);

    /* ---------- 聊天 ---------- */

    const add = (text, who) => {
      const el = document.createElement('div');
      el.className = `message ${who}`;
      el.textContent = text;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    };

    const setBusy = (value, mood) => {
      state.busy = value;
      if (value && mood) setMood(mood);
      if (!value) setMood(state.sleeping ? 'sleepy' : 'idle');
    };

    const updatePinLabel = (value) => { pin.textContent = value ? '置顶：开' : '置顶：关'; };
    const updateModeLabel = (value) => { mode.textContent = value ? '恢复聊天窗口' : '悬浮机器人'; };

    const applyMode = (modeName) => {
      const compact = modeName === 'compact';
      document.body.classList.toggle('compact', compact);
      updateModeLabel(compact);
      applyCameraLayout(compact);
      // 等窗口尺寸和 CSS 完成一轮布局后再同步 renderer，避免 UI 与模型错一拍。
      requestAnimationFrame(() => requestAnimationFrame(() => {
        resize();
        controls.update();
      }));
    };

    if (window.desktop) {
      window.desktop.getAlwaysOnTop().then(updatePinLabel);
      window.desktop.getMode().then((value) => applyMode(value ? 'compact' : 'normal'));
      pin.addEventListener('click', async () => updatePinLabel(await window.desktop.setAlwaysOnTop(!(pin.textContent === '置顶：开'))));
      mode.addEventListener('click', async () => applyMode((await window.desktop.setMode(!document.body.classList.contains('compact'))) ? 'compact' : 'normal'));
      window.desktop.onModeChanged(applyMode);
    }

    document.querySelector('#act-hello').addEventListener('click', greet);
    document.querySelector('#act-pat').addEventListener('click', pat);
    document.querySelector('#act-rest').addEventListener('click', rest);

    document.querySelector('#voice').addEventListener('click', () => {
      state.lastActive = Date.now();
      setMood('curious', 2000);
      statusEl.textContent = '语音转文字接口已预留，后续接入';
      add('语音输入功能已预留，当前还不会调用识别服务。', 'assistant');
      showBubble('语音还没接好，先用文字聊吧。');
    });

    document.querySelector('#composer').addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || state.busy) return;
      state.lastActive = Date.now();
      wakeUp();
      add(text, 'user');
      input.value = '';
      setBusy(true, 'thinking');
      thinkPose();
      spinSpeed = 1.6;
      statusEl.textContent = '正在思考…';
      const pending = add('正在思考…', 'assistant pending');
      showBubble('让我想一想。', 8000);
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, source: 'text' })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '请求失败');
        pending.remove();
        spinSpeed = 0;
        setBusy(false);
        setMood('speaking', 2600);
        happyPose();
        add(data.reply, 'assistant');
        showBubble('说完了，你接着讲。');
        statusEl.textContent = '后端已连接 · 数据已记录';
        updateBond(5);
      } catch (error) {
        pending.remove();
        spinSpeed = 0;
        setBusy(false);
        setMood('annoyed', 2000);
        shake();
        add(`暂时无法连接后端：${error.message}`, 'assistant');
        statusEl.textContent = '后端连接失败';
      }
    });

    /* 调试/自动化测试钩子(不影响正常功能) */
    window.__assistantDebug = {
      clips: () => Object.keys(clips),
      playing: () => (currentAction ? currentAction.getClip().name : null),
      playAction: (name) => playAction(name),
      handAt: (x, y) => handAt(x, y), handScreen: () => handScreen(),
      pickModel: (x, y) => pickModel(x, y),
      viewportRect: () => { const r = viewport.getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height }; },
      scene: () => scene, camera: () => camera, model: () => model,
      skeletonMeshes: () => skeletonMeshes, THREE,
    };
  </script>
</body>
</html>
